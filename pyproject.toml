[build-system]
requires = ["setuptools>80", "wheel", "setuptools_scm[toml]>9"]
build-backend = "setuptools.build_meta"

[project]
name = "prance"
description = "Resolving Swagger/OpenAPI 2.0 and 3.x Parser"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
license = {text = "MITNFA"}
authors = [
    {name = "Jens Finkhaeuser", email = "jens@finkhaeuser.de"}
]
maintainers = [
    {name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de"}
]
keywords = ["swagger", "openapi", "parsing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "chardet>=5.2",
    "ruamel.yaml>=0.18.16",
    "requests>=2.32.5",
    "packaging>=25.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/RonnyPfannschmidt/prance"

[project.optional-dependencies]
icu = ["PyICU~=2.14"]
ssv = ["swagger-spec-validator~=3.0.4"]
osv = ["openapi-spec-validator~=0.9.0"]
flex = ["flex~=6.14.1"]
cli = ["click>=8.3.0"]
fast = ["orjson>=3.9"]

[project.scripts]
prance = "prance.cli:cli"

[dependency-groups]
dev = [
    "tox>=4.32.0",
    "bumpversion>=0.6.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "sphinx>=8.1.3,<8.2",
    "towncrier>=25.8.0",
]

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
exclude = ["ez_setup", "examples", "tests"]

[tool.setuptools_scm]
write_to = "prance/_version.py"

[tool.pytest.ini_options]
addopts = "--verbose --cov=prance --cov-report=term-missing --cov-fail-under=89"
testpaths = ["tests"]
markers = [
    "requires_network: Marks test as requiring network connections (deselect with '-m \"not requires_network\"')",
]

[tool.towncrier]
package = "prance"
package_dir = "."
filename = "CHANGES.rst"
directory = "changelog.d"
